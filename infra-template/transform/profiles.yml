# dbt profile for the training environment. Uses key-pair authentication via
# environment variables so the same profile works locally and in CI:
#   SNOWFLAKE_ACCOUNT  - your account identifier, e.g. MYORG-ABC12345
#   SNOWFLAKE_USER     - the dbt service user, e.g. DBT_SVC_USER_DEV
#   SNOWFLAKE_PRIVATE_KEY  - the PEM private key contents (used by CI), OR
#   SNOWFLAKE_PRIVATE_KEY_PATH  - path to the private key file (used locally)
training:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER_DEV') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING_XS_DEV') }}"
      database: "{{ env_var('DBT_TRAINING_DB', 'TRAINING_DEV') }}"
      schema: staging
      threads: 4
