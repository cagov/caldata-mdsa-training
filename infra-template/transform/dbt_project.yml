# Minimal dbt project for the self-service training environment.
name: "training"
version: "1.0.0"
config-version: 2

profile: "training"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false

# Everything lands in the single training database. Staging models materialize as
# views in the STAGING schema; marts as tables in the MARTS schema.
models:
  training:
    +database: "{{ env_var('DBT_TRAINING_DB', 'TRAINING_DEV') }}"
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  training:
    +database: "{{ env_var('DBT_TRAINING_DB', 'TRAINING_DEV') }}"
    +schema: raw
