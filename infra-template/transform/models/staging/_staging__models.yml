version: 2

models:
  - name: stg_customers
    description: "Lightly cleaned customer records from the example seed."
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: "Customer first and last name concatenated."
      - name: state
        description: "Two-letter US state code."
        data_tests:
          - not_null
